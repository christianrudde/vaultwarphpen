name: Reference

# Builds the Vaultwarden commit pinned in parity/reference.json for Linux (and,
# when started by hand, for macOS), so its behaviour can be compared with ours
# without a local Rust toolchain. The binaries are kept as workflow artifacts. The databases job then compares the databases
# Vaultwarden creates with ours (.github/scripts/database-parity.sh).
on:
  push:
    paths:
      - ".github/workflows/reference.yml"
      - ".github/scripts/database-parity.sh"
      - "parity/reference.json"
      - "parity/schema/**"
      - "app/Database/**"
      - "app/Console/Commands/ParitySchema.php"
      - "database/vaultwarden/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vaultwarden (${{ matrix.target }})
    runs-on: ${{ matrix.target == 'macos-arm64' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # GitHub's macOS runners are often unavailable, so macOS is only built when started by hand.
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["linux-x86_64", "macos-arm64"]' || '["linux-x86_64"]') }}
    env:
      # The macOS build is for local comparisons; SQLite is linked in, so it needs no client libraries.
      FEATURES: ${{ matrix.target == 'macos-arm64' && 'sqlite' || 'sqlite,mysql,postgresql' }}

    steps:
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libmariadb-dev-compat libpq-dev libssl-dev pkg-config

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned commit
        id: pin
        run: |
          commit="$(jq -r .commit parity/reference.json)"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          # What build.rs derives from git on main; the shallow checkout has no tags to derive it from.
          echo "version=$(jq -r .release parity/reference.json)-${commit:0:8}" >> "$GITHUB_OUTPUT"

      - name: Checkout Vaultwarden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dani-garcia/vaultwarden
          ref: ${{ steps.pin.outputs.commit }}
          path: reference/vaultwarden
          persist-credentials: false

      - name: Install the Rust toolchain
        working-directory: reference/vaultwarden
        run: |
          channel="$(sed -nE 's/^channel = "(.*)"/\1/p' rust-toolchain.toml)"
          rm rust-toolchain.toml
          rustup toolchain install "${channel}" --profile minimal --no-self-update
          rustup default "${channel}"
          rustc -vV

      - name: Rust caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: reference/vaultwarden -> target
          key: ${{ env.FEATURES }}

      - name: Build
        working-directory: reference/vaultwarden
        env:
          VW_VERSION: ${{ steps.pin.outputs.version }}
        run: cargo build --locked --profile release-low --features "${FEATURES}"

      - name: Smoke test
        working-directory: reference/vaultwarden
        env:
          EXPECTED_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/data"
          DATA_FOLDER="${RUNNER_TEMP}/data" WEB_VAULT_ENABLED=false ROCKET_PORT=8000 \
            target/release-low/vaultwarden > "${RUNNER_TEMP}/vaultwarden.log" 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8000/alive > /dev/null 2>&1 && break
            sleep 1
          done
          status=0
          version="$(curl -fsS http://127.0.0.1:8000/api/version)" || status=1
          echo "Version: ${version}"
          test "${version}" = "\"${EXPECTED_VERSION}\"" || status=1
          kill "${pid}" || true
          cat "${RUNNER_TEMP}/vaultwarden.log"
          test -f "${RUNNER_TEMP}/data/db.sqlite3" || status=1
          exit "${status}"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaultwarden-${{ steps.pin.outputs.commit }}-${{ matrix.target }}
          path: reference/vaultwarden/target/release-low/vaultwarden
          if-no-files-found: error
          retention-days: 90

  databases:
    name: Compare databases
    needs: build
    # Only the Linux binary is needed; run even if the macOS build failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U root"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmariadb3 libpq5

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned commit
        id: pin
        run: echo "commit=$(jq -r .commit parity/reference.json)" >> "$GITHUB_OUTPUT"

      - name: Download Vaultwarden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vaultwarden-${{ steps.pin.outputs.commit }}-linux-x86_64
          path: ${{ runner.temp }}/vaultwarden

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, sodium, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Compare databases
        run: |
          chmod +x "${RUNNER_TEMP}/vaultwarden/vaultwarden"
          .github/scripts/database-parity.sh "${RUNNER_TEMP}/vaultwarden/vaultwarden" sqlite mysql pgsql

      - name: Compare with the committed snapshots
        if: ${{ !cancelled() }}
        run: |
          git add --intent-to-add parity/schema
          if ! git diff --exit-code -- parity/schema; then
            echo "::error::The schema snapshots differ from the databases Vaultwarden creates. Commit the parity-schema artifact to parity/schema."
            exit 1
          fi

      - name: Upload snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-schema
          path: parity/schema/
          if-no-files-found: error
