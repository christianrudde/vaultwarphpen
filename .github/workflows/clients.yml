name: Clients

# Drives the official Bitwarden clients against Vaultwarphpen with their own
# cryptography: the web vault it serves, in Chromium, and the CLI from npm
# (tests/Clients, .github/scripts/clients.sh). The Reference workflow runs the
# same tests against Vaultwarden.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    name: Web vault and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sodium, openssl
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/Clients/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Read the web vault pin
        id: pin
        run: echo "web-vault=$(jq -r .web_vault_digest parity/reference.json)" >> "$GITHUB_OUTPUT"

      - name: Cache the web vault
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web-vault
          key: web-vault-${{ steps.pin.outputs.web-vault }}

      - name: Install the web vault
        run: php artisan vaultwarden:web-vault

      - name: Install the clients
        working-directory: tests/Clients
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium

      - name: Run the clients
        run: .github/scripts/clients.sh

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clients-report
          path: |
            tests/Clients/playwright-report/
            tests/Clients/test-results/
          retention-days: 14
